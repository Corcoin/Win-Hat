<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plug-and-Play P2P Chat with QR Scanning</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #chat {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        #message {
            width: 80%;
        }
        #send {
            width: 18%;
        }
        #qrcode {
            margin-top: 20px;
        }
        #video {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        button {
            display: block;
            margin: 10px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
</head>
<body>
    <h1>Plug-and-Play P2P Chat</h1>
    <div id="chat"></div>
    <input type="text" id="message" placeholder="Type your message...">
    <button id="send">Send</button>
    <h2>Connection Setup</h2>
    <div id="qrcode"></div>
    <p id="instructions">Generating connection details...</p>
    <button id="scanQR">Scan QR Code</button>
    <video id="video" autoplay></video>
    <script>
        const peerConnection = new RTCPeerConnection();
        let dataChannel;

        // DOM Elements
        const chat = document.getElementById("chat");
        const message = document.getElementById("message");
        const send = document.getElementById("send");
        const qrcodeContainer = document.getElementById("qrcode");
        const instructions = document.getElementById("instructions");
        const video = document.getElementById("video");
        const scanQRButton = document.getElementById("scanQR");

        // Automatically create data channel
        function setupDataChannel() {
            dataChannel = peerConnection.createDataChannel("chat");
            dataChannel.onmessage = (event) => {
                const msg = document.createElement("div");
                msg.textContent = "Peer: " + event.data;
                chat.appendChild(msg);
            };
        }

        // Send messages
        send.addEventListener("click", () => {
            if (message.value.trim() !== "") {
                dataChannel.send(message.value);
                const msg = document.createElement("div");
                msg.textContent = "You: " + message.value;
                chat.appendChild(msg);
                message.value = "";
            }
        });

        // Handle incoming data channel
        peerConnection.ondatachannel = (event) => {
            dataChannel = event.channel;
            dataChannel.onmessage = (event) => {
                const msg = document.createElement("div");
                msg.textContent = "Peer: " + event.data;
                chat.appendChild(msg);
            };
        };

        // Handle ICE candidates
        peerConnection.onicecandidate = (event) => {
            if (!event.candidate) {
                console.log("All ICE candidates sent.");
            }
        };

        // QR Code Scanning
        scanQRButton.addEventListener("click", async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;

                video.addEventListener("loadedmetadata", () => {
                    scanQRCode(stream);
                });
            } catch (error) {
                console.error("Camera access denied:", error);
                alert("Unable to access the camera. Please grant permissions and try again.");
            }
        });

        const scanQRCode = (stream) => {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            const checkQRCode = () => {
                if (video.videoWidth === 0 || video.videoHeight === 0) {
                    // Wait for video dimensions to be ready
                    requestAnimationFrame(checkQRCode);
                    return;
                }

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const qrCodeData = jsQR(imageData.data, canvas.width, canvas.height);

                if (qrCodeData) {
                    // Stop video stream when QR code is detected
                    stream.getTracks().forEach((track) => track.stop());
                    video.srcObject = null;

                    processScannedQRCode(qrCodeData.data);
                } else {
                    // Continue scanning
                    requestAnimationFrame(checkQRCode);
                }
            };

            checkQRCode();
        };

        // Process scanned QR code
        const processScannedQRCode = async (data) => {
            if (data.includes("offer")) {
                instructions.textContent = "Processing offer...";
                const offer = JSON.parse(decodeURIComponent(data.replace("?offer=", "")));
                await peerConnection.setRemoteDescription(offer);
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                const answerString = JSON.stringify(answer);

                QRCode.toCanvas(
                    document.createElement("canvas"),
                    `?answer=${encodeURIComponent(answerString)}`,
                    { width: 200 },
                    (error, canvas) => {
                        if (error) {
                            console.error("Error generating QR code:", error);
                            return;
                        }
                        qrcodeContainer.innerHTML = "";
                        qrcodeContainer.appendChild(canvas);
                        instructions.textContent = "Share this QR code with the host.";
                    }
                );
            } else if (data.includes("answer")) {
                instructions.textContent = "Processing answer...";
                const answer = JSON.parse(decodeURIComponent(data.replace("?answer=", "")));
                await peerConnection.setRemoteDescription(answer);
                instructions.textContent = "Connection established!";
            }
        };

        // Automatically generate an offer or answer
        (async function initializeConnection() {
            const urlParams = new URLSearchParams(window.location.search);
            const remoteOffer = urlParams.get("offer");

            if (!remoteOffer) {
                // This device is the Host
                instructions.textContent = "Scan this QR code with the peer device.";
                setupDataChannel();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                const offerString = JSON.stringify(offer);
                QRCode.toCanvas(
                    document.createElement("canvas"),
                    `?offer=${encodeURIComponent(offerString)}`,
                    { width: 200 },
                    (error, canvas) => {
                        if (error) {
                            console.error("Error generating QR code:", error);
                            return;
                        }
                        qrcodeContainer.innerHTML = "";
                        qrcodeContainer.appendChild(canvas);
                        console.log("QR code generated successfully.");
                    }
                );
            }
        })();
    </script>
</body>
</html>
